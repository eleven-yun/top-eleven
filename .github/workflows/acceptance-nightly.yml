name: Phase9 Acceptance Nightly

on:
  schedule:
    # 02:15 UTC every day
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  acceptance-dual-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: top-eleven
          environment-file: environment.yml
          auto-activate-base: false
          miniforge-variant: Miniforge3

      - name: Restore cached data artifacts
        uses: actions/cache@v4
        with:
          key: acceptance-inputs-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            acceptance-inputs-${{ runner.os }}-${{ github.ref_name }}-
          path: |
            data/raw/china_lottery
            data/raw/football_data_co_uk
            data/processed
            output/predictions

      - name: Build dataset and refresh CN odds inputs
        shell: bash -l {0}
        run: |
          set -euo pipefail

          mkdir -p data/raw/china_lottery data/processed output/predictions

          # Always refresh core football dataset artifacts.
          conda run -n top-eleven python data/build_dataset.py --config config/data_config.json

          end_date="$(date -u +%F)"

          # Bootstrap from 2025/26 season start when cache is cold; otherwise incremental append.
          if [[ -f data/raw/china_lottery/odds_raw.jsonl ]]; then
            cn_start="$(date -u -d '2 days ago' +%F)"
            cn_append="--append"
          else
            cn_start="2025-08-01"
            cn_append=""
          fi

          if [[ -f data/raw/china_lottery/prematch_odds_raw.jsonl ]]; then
            prematch_start="$(date -u -d '2 days ago' +%F)"
            prematch_append="--append"
          else
            prematch_start="2025-08-01"
            prematch_append=""
          fi

          conda run -n top-eleven python scripts/fetch_cn_odds.py \
            --start "${cn_start}" \
            --end "${end_date}" \
            --delay 0.4 \
            ${cn_append}

          conda run -n top-eleven python scripts/fetch_cn_prematch_odds.py \
            --start "${prematch_start}" \
            --end "${end_date}" \
            --delay 0.2 \
            ${prematch_append}

          conda run -n top-eleven python scripts/enrich_lottery_odds.py --min-score 0.45
          conda run -n top-eleven python scripts/enrich_prematch_odds.py

      - name: Generate test predictions
        shell: bash -l {0}
        run: |
          set -euo pipefail
          conda run -n top-eleven python scripts/predict_lgbm.py --task handicap_label --split test
          conda run -n top-eleven python scripts/predict_lgbm.py --task fulltime_label --split test

      - name: Preflight acceptance inputs
        shell: bash -l {0}
        run: |
          required=(
            "data/processed/match_meta.jsonl"
            "data/processed/lottery_market.jsonl"
            "data/processed/lottery_market_cn.jsonl"
            "data/processed/lottery_market_prematch_cn.jsonl"
            "output/predictions/handicap_label_test.jsonl"
            "output/predictions/fulltime_label_test.jsonl"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing required artifact: $f"
              missing=1
            fi
          done
          if [[ $missing -ne 0 ]]; then
            echo "Acceptance workflow prerequisites are missing on this runner."
            echo "Generate/upload processed markets and prediction JSONL artifacts before this job."
            exit 1
          fi

      - name: Execute dual-profile acceptance script
        shell: bash -l {0}
        run: bash scripts/run_acceptance_dual_profile.sh

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-dual-profile-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            output/backtest/acceptance_report_operational.json
            output/backtest/acceptance_report_baseline.json