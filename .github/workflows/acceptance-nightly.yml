name: Phase9 Acceptance Nightly

on:
  schedule:
    # 02:15 UTC every day
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  acceptance-dual-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: top-eleven
          environment-file: environment.yml
          auto-activate-base: false
          miniforge-variant: Miniforge3

      - name: Run dual-profile acceptance check
        shell: bash -l {0}
        run: |
          required=(
            "data/processed/match_meta.jsonl"
            "data/processed/lottery_market.jsonl"
            "data/processed/lottery_market_cn.jsonl"
            "data/processed/lottery_market_prematch_cn.jsonl"
            "output/predictions/handicap_label_test.jsonl"
            "output/predictions/fulltime_label_test.jsonl"
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing required artifact: $f"
              missing=1
            fi
          done
          if [[ $missing -ne 0 ]]; then
            echo "Acceptance workflow prerequisites are missing on this runner."
            echo "Generate/upload processed markets and prediction JSONL artifacts before this job."
            exit 1
          fi

      - name: Execute dual-profile acceptance script
        shell: bash -l {0}
        run: bash scripts/run_acceptance_dual_profile.sh

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-dual-profile-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            output/backtest/acceptance_report_operational.json
            output/backtest/acceptance_report_baseline.json